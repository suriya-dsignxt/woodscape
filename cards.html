<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        .square{
            height: 250px;
            width: 250px;
            background-color: gray;
            border: 1px solid gray;
            /* Cut bottom-right corner */
            clip-path: polygon(
                0 0,
                100% 0,
                100% 80%,
                80% 100%,
                0 100%
            );
        }
        .square2{
            height: 249px;
            width: 249px;
            background-color: white;
            margin-left: 0.5px;

            /* Cut bottom-right corner */
            clip-path: polygon(
                0 0,
                100% 0,
                100% 80%,
                80% 100%,
                0 100%
            );
        }
    </style>

    <div class="square">
        <div class="square2">

        </div>
    </div>
</body>
</html>
